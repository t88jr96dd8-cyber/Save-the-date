<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save the Date</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 20px;
      font-family: Arial, sans-serif;
      background: #fffaf2;
      color: #222;
    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      line-height: 0.9;
      margin-bottom: 12px;
      transform: rotate(-2deg);
    }

    .pink { color: #ff4f9a; }
    .yellow { color: #f5c542; font-size: 24px; }
    .blue { color: #20b7b0; }

    .subtitle {
      margin-bottom: 25px;
      color: #555;
    }

    .card {
      background: white;
      border: 3px solid #222;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 5px 5px 0 #222;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border: 2px solid #222;
      border-radius: 12px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 3px solid #222;
      border-radius: 18px;
      background: #ff4f9a;
      color: white;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 5px 5px 0 #222;
    }

    button:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 #222;
    }

    .note {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 18px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">
    <span class="pink">SAVE</span><br>
    <span class="yellow">the</span>
    <span class="blue">DATE</span>
  </div>

  <div class="subtitle">
    Never miss a perfect appointment again ✨
  </div>

  <div class="card">
    <label>📍 Location</label>

    <select id="location">
      <option>Heilbronn</option>
      <option>Stuttgart</option>
      <option>Karlsruhe</option>
    </select>
  </div>

  <div class="card">
    <label>🏛️ Service</label>

    <select id="service">
      <option>Bürgeramt</option>
      <option>Passport / ID</option>
      <option>Driving Licence</option>
    </select>
  </div>

  <div class="card">
    <label>📅 Preferred date</label>

    <input id="date" type="date">
  </div>

  <button onclick="startMonitoring()">
    🔔 Notify me
  </button>

  <div class="note">
    We'll notify you as soon as a matching appointment becomes available.
  </div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

function startMonitoring() {

  const data = {
    telegramUserId: tg.initDataUnsafe?.user?.id,
    initData: tg.initData,

    location: document.getElementById("location").value,

    service: document.getElementById("service").value,

    date: document.getElementById("date").value
  };

  console.log(data);

  tg.showPopup({
    title: "You're all set! 🎉",

    message:
      "We'll notify you when a matching appointment becomes available.",

    buttons: [
      {
        type: "ok"
      }
    ]
  });

}

</script>

</body>
</html>
