<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Save the Date</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f7, #fff9d9, #e9ffff);
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .logo {
      text-align: center;
      margin: 15px 0 5px;
      font-size: 38px;
      font-weight: 900;
      line-height: 1;
    }

    .logo .save {
      color: #ff4fa3;
    }

    .logo .the {
      color: #ffd43b;
      font-size: 25px;
    }

    .logo .date {
      color: #20c9c9;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 16px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #eee;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: #fafafa;
    }

    input:focus {
      border-color: #20c9c9;
      background: white;
    }

    .optional {
      font-weight: normal;
      color: #777;
      font-size: 13px;
    }

    .hint {
      font-size: 13px;
      color: #777;
      margin-top: 10px;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 17px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: linear-gradient(90deg, #ff4fa3, #8b5cf6, #20c9c9);
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(139,92,246,0.25);
    }

    .button:active {
      transform: scale(0.98);
    }

    .popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .popup-content {
      background: white;
      border-radius: 22px;
      padding: 25px;
      text-align: center;
      max-width: 350px;
      width: 100%;
    }

    .popup-content h2 {
      margin-top: 0;
      color: #ff4fa3;
    }

    .close-button {
      margin-top: 15px;
      border: none;
      background: #20c9c9;
      color: white;
      padding: 12px 25px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <span class="save">SAVE</span>
      <span class="the">the</span>
      <span class="date">DATE</span>
    </div>

    <div class="subtitle">
      Never miss a perfect appointment again ✨
    </div>

    <!-- LOCATION -->
    <div class="card">
      <label>📍 Location</label>

      <input
        id="location"
        type="text"
        placeholder="e.g. München"
      >
    </div>

    <!-- SERVICE -->
    <div class="card">
      <label>📝 Service</label>

      <input
        id="service"
        type="text"
        placeholder="e.g. Bürgeramt"
      >
    </div>

    <!-- DATE RANGE -->
    <div class="card">
      <label>📅 Date range</label>

      <input
        id="dateFrom"
        type="date"
      >

      <br><br>

      <input
        id="dateTo"
        type="date"
      >
    </div>

    <!-- TIME RANGE -->
    <div class="card">
      <label>
        🕐 Time range
        <span class="optional">(optional)</span>
      </label>

      <input
        id="timeFrom"
        type="time"
      >

      <br><br>

      <input
        id="timeTo"
        type="time"
      >

      <div class="hint">
        Leave empty if any time is okay.
      </div>
    </div>

    <!-- BUTTON -->
    <button class="button" onclick="startMonitoring()">
      🔔 Notify me
    </button>

  </div>


  <!-- POPUP -->
  <div class="popup" id="popup">

    <div class="popup-content">

      <h2>You're all set! 🎉</h2>

      <p>
        We'll notify you when an appointment matching your preferences becomes available.
      </p>

      <button class="close-button" onclick="closePopup()">
        Done
      </button>

    </div>

  </div>


  <script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    function startMonitoring() {

      const location =
        document.getElementById("location").value;

      const service =
        document.getElementById("service").value;

      const dateFrom =
        document.getElementById("dateFrom").value;

      const dateTo =
        document.getElementById("dateTo").value;

      const timeFrom =
        document.getElementById("timeFrom").value || null;

      const timeTo =
        document.getElementById("timeTo").value || null;


      const telegramUserId =
        tg.initDataUnsafe?.user?.id || null;


      const data = {

        telegramUserId: telegramUserId,

        initData: tg.initData,

        location: location,

        service: service,

        dateFrom: dateFrom,

        dateTo: dateTo,

        timeFrom: timeFrom,

        timeTo: timeTo

      };


      console.log("Monitoring request:", data);


      document.getElementById("popup").style.display = "flex";
    }


    function closePopup() {

      document.getElementById("popup").style.display = "none";

    }

  </script>

</body>
</html>
